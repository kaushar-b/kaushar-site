<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viewy • AI Red Teamer & Pentester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-gradient-to-br from-[#0A0F1C] to-[#111827] text-[#E0F2FE] min-h-screen overflow-x-hidden relative">

  <!-- Animated Particle Background -->
  <canvas id="particles" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Hero -->
  <header class="relative z-10 min-h-screen flex flex-col justify-center items-center px-6 text-center">
    <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white neon-glow">
      Viewy
    </h1>
    <p class="text-2xl md:text-4xl font-mono typing-text">
      <span id="roles"></span><span class="cursor">|</span>
    </p>
  </header>

  <!-- Projects Section -->
  <section id="projects" class="py-20 px-6 relative z-10">
    <h2 class="text-5xl font-bold text-center mb-16 neon-text">Projects</h2>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
      <!-- Example Project Card -->
      <div class="project-card bg-[#1E293B]/50 backdrop-blur-md border border-cyan-500/30 rounded-xl p-6 hover:border-[#FF0066] transition-all duration-300">
        <h3 class="text-2xl font-semibold mb-3">FraminghamAI</h3>
        <p class="mb-4">ML-powered CVD risk calculator with SHAP explainability</p>
        <a href="https://github.com/yourusername/cardiovascular-risk-ml" target="_blank" class="text-cyan-400 hover:text-[#FF0066]">View Repo →</a>
      </div>
      <!-- Add more cards for your OWASP/pentest projects -->
    </div>
  </section>

  <!-- Skills/Tools -->
  <section id="skills" class="py-20 px-6 bg-black/30 relative z-10">
    <h2 class="text-5xl font-bold text-center mb-16 neon-text">Tools & Skills</h2>
    <div class="flex flex-wrap justify-center gap-8 max-w-5xl mx-auto">
      <i class="fab fa-python text-6xl text-cyan-400 hover:neon-glow transition"></i>
      <i class="fas fa-shield-alt text-6xl text-[#FF0066] hover:neon-glow transition"></i>
      <!-- Add more: burp, nmap, wireshark, tensorflow, etc. as icons or text badges -->
    </div>
  </section>

  <!-- Achievements / Certs -->
  <section id="achievements" class="py-20 px-6 relative z-10">
    <h2 class="text-5xl font-bold text-center mb-16 neon-text">Achievements & Certs</h2>
    <div class="grid md:grid-cols-3 gap-8 max-w-6xl mx-auto">
      <!-- Example -->
      <div class="bg-[#1E293B]/50 border border-purple-500/30 rounded-xl p-6 text-center">
        <img src="images/badge-oscp.png" alt="OSCP" class="mx-auto h-32 mb-4"/>
        <p class="text-xl">OSCP Certified</p>
      </div>
      <!-- Add more badges, CTF ranks, comp wins -->
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
